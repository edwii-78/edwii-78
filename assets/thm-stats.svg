<svg width="760" height="210" viewBox="0 0 760 210" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Left panel ambient glow -->
    <linearGradient id="lpanel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#a371f7" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#a371f7" stop-opacity="0.00"/>
    </linearGradient>
    <!-- Top accent bar -->
    <linearGradient id="topbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#a371f7"    stop-opacity="0.0"/>
      <stop offset="20%"  stop-color="#a371f7"    stop-opacity="1.0"/>
      <stop offset="65%"  stop-color="#1f6feb" stop-opacity="1.0"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0.0"/>
    </linearGradient>
    <!-- Bottom pulse bar -->
    <linearGradient id="botbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#a371f7"    stop-opacity="0.0"/>
      <stop offset="35%"  stop-color="#a371f7"    stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Card base -->
  <rect width="760" height="210" rx="8" fill="#0d1117" stroke="#21262d" stroke-width="0.5"/>

  <!-- Left panel ambient tint -->
  <rect x="0" y="0" width="200" height="210" rx="8" fill="url(#lpanel)"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="760" height="2" rx="1" fill="url(#topbar)"/>

  <!-- Left edge accent -->
  <rect x="0" y="12" width="2" height="186" rx="1" fill="#a371f7" opacity="0.6"/>

  <!-- ── LEFT IDENTITY PANEL ─────────────────────────────────────────── -->

  <!-- Platform label -->
  <text x="18" y="32"
    font-family="ui-monospace,'SF Mono',Consolas,monospace"
    font-size="8" fill="#a371f7" font-weight="700" letter-spacing="2"
    opacity="0.7">TRYHACKME</text>

  <!-- Username -->
  <text x="18" y="56"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,sans-serif"
    font-size="17" fill="#e6edf3" font-weight="600"
    textLength="174" lengthAdjust="spacingAndGlyphs">edwindominic7878</text>

  <!-- Rank pill — no filter, solid colour only -->
  <rect x="16" y="64" width="86" height="18" rx="9"
    fill="#a371f7" opacity="0.12" stroke="#a371f7" stroke-width="0.6"/>
  <text x="59" y="76"
    font-family="ui-monospace,'SF Mono',Consolas,monospace"
    font-size="9" fill="#a371f7" text-anchor="middle"
    font-weight="700" letter-spacing="0.5">SEEKER</text>

  <!-- Thin rule -->
  <line x1="16" y1="96" x2="188" y2="96" stroke="#21262d" stroke-width="0.5"/>

  <!-- Percentile — the standout number -->
  <text x="16" y="126"
    font-family="ui-monospace,'SF Mono',Consolas,monospace"
    font-size="26" fill="#a371f7" font-weight="700">Top 30%</text>

  <text x="16" y="142"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
    font-size="9" fill="#6e7681" letter-spacing="1.2">GLOBAL PERCENTILE</text>

  <!-- ── VERTICAL DIVIDERS ──────────────────────────────────────────── -->
  <line x1="200" y1="14" x2="200" y2="188" stroke="#21262d" stroke-width="0.5"/>
  <line x1="345" y1="14" x2="345" y2="188" stroke="#21262d" stroke-width="0.5"/>
  <line x1="490" y1="14" x2="490" y2="188" stroke="#21262d" stroke-width="0.5"/>
  <line x1="635" y1="14" x2="635" y2="188" stroke="#21262d" stroke-width="0.5"/>

  <!-- ── HORIZONTAL MID RULE (separates top/bottom stat rows) ──────── -->
  <line x1="200" y1="120" x2="756" y2="120" stroke="#21262d" stroke-width="0.5"/>

  <!-- ── STAT: POINTS ──────────────────────────────────────────────── -->
  <text x="220" y="40"
    font-family="ui-monospace,'SF Mono',Consolas,monospace"
    font-size="8" fill="#6e7681" letter-spacing="1.5">POINTS</text>
  <text x="220" y="90"
    font-family="ui-monospace,'SF Mono',Consolas,monospace"
    font-size="40" fill="#e6edf3" font-weight="700">34</text>

  <!-- ── STAT: ROOMS COMPLETED ─────────────────────────────────────── -->
  <text x="365" y="40"
    font-family="ui-monospace,'SF Mono',Consolas,monospace"
    font-size="8" fill="#6e7681" letter-spacing="1.5">ROOMS</text>
  <text x="365" y="90"
    font-family="ui-monospace,'SF Mono',Consolas,monospace"
    font-size="40" fill="#3fb950" font-weight="700">16</text>

  <!-- ── STAT: DAY STREAK ──────────────────────────────────────────── -->
  <text x="510" y="40"
    font-family="ui-monospace,'SF Mono',Consolas,monospace"
    font-size="8" fill="#6e7681" letter-spacing="1.5">DAY STREAK</text>
  <text x="510" y="90"
    font-family="ui-monospace,'SF Mono',Consolas,monospace"
    font-size="40" fill="#d29922" font-weight="700">42</text>

  <!-- ── STAT: BADGES ──────────────────────────────────────────────── -->
  <text x="648" y="40"
    font-family="ui-monospace,'SF Mono',Consolas,monospace"
    font-size="8" fill="#6e7681" letter-spacing="1.5">BADGES</text>
  <text x="648" y="90"
    font-family="ui-monospace,'SF Mono',Consolas,monospace"
    font-size="40" fill="#bc8cff" font-weight="700">3</text>

  <!-- ── BOTTOM ROW — secondary stats ─────────────────────────────── -->

  <!-- Completed label -->
  <text x="365" y="140"
    font-family="ui-monospace,'SF Mono',Consolas,monospace"
    font-size="8" fill="#6e7681" letter-spacing="1">COMPLETED</text>
  <text x="365" y="162"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
    font-size="12" fill="#8b949e">16 rooms · 3 badges</text>

  <!-- Streak context -->
  <text x="510" y="140"
    font-family="ui-monospace,'SF Mono',Consolas,monospace"
    font-size="8" fill="#6e7681" letter-spacing="1">BEST STREAK</text>
  <text x="510" y="162"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
    font-size="12" fill="#8b949e">42 days active</text>

  <!-- Paths -->
  <text x="648" y="140"
    font-family="ui-monospace,'SF Mono',Consolas,monospace"
    font-size="8" fill="#6e7681" letter-spacing="1">ACTIVE PATHS</text>
  <text x="648" y="162"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
    font-size="12" fill="#8b949e">SOC L1 · AI Security</text>

  <!-- Left panel bottom — cert callout -->
  <text x="16" y="140"
    font-family="ui-monospace,'SF Mono',Consolas,monospace"
    font-size="8" fill="#6e7681" letter-spacing="1">CLEARANCE</text>
  <text x="16" y="160"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
    font-size="11" fill="#a371f7">CEH v13 · CSCU</text>

  <!-- ── FOOTER ─────────────────────────────────────────────────────── -->
  <line x1="0" y1="188" x2="760" y2="188" stroke="#21262d" stroke-width="0.5"/>

  <!-- Status dot -->
  <circle cx="14" cy="199" r="3.5" fill="#3fb950">
    <animate attributeName="opacity" values="1;0.15;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="23" y="203"
    font-family="ui-monospace,'SF Mono',Consolas,monospace"
    font-size="8" fill="#3fb950" letter-spacing="0.5">ACTIVE</text>

  <!-- Profile URL -->
  <text x="90" y="203"
    font-family="ui-monospace,'SF Mono',Consolas,monospace"
    font-size="8" fill="#30363d">tryhackme.com/p/edwindominic7878</text>

  <!-- Timestamp -->
  <text x="752" y="203"
    font-family="ui-monospace,'SF Mono',Consolas,monospace"
    font-size="8" fill="#30363d" text-anchor="end">Updated 2026-07-25 19:01 UTC</text>

  <!-- Bottom animated pulse -->
  <rect x="0" y="208" width="760" height="2" rx="1" fill="url(#botbar)" opacity="0">
    <animate attributeName="opacity" values="0;0.7;0" dur="3.5s" repeatCount="indefinite"/>
  </rect>
</svg>